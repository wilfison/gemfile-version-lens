name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      # --- Code quality ---
      - name: Lint
        run: npm run lint

      - name: RuboCop (Ruby lint)
        run: bundle exec rubocop

      - name: Compile
        run: npm run compile

      # --- Tests ---
      # Runs both bin/versions.rb and bin/audit.rb minitest suites directly
      # (no Rakefile); minitest is a default gem, so no bundler needed here.
      - name: Ruby tests (Minitest)
        run: npm run test:ruby

      # vscode-test launches a headless VS Code instance; xvfb provides the
      # virtual display it needs on Linux runners. `npx vscode-test` reuses the
      # tests already compiled into out/ by the Compile step above.
      - name: Extension tests
        run: xvfb-run -a npx vscode-test
